name: Keep Supabase Alive

on:
  schedule:
    # 毎日 UTC 0:00 (JST 9:00) に実行。Supabaseの無料プランは7日間アクセスがないと
    # プロジェクトが自動休止するため、軽いクエリを送って稼働状態を維持する。
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/equipment?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
